name: Release

# Push a tag like v0.1.0 to build Murmur and publish it as a GitHub Release.
#
# With these repository secrets the app is signed with your Developer ID and notarized by Apple,
# so it opens on any Mac with no warnings and keeps its permissions across updates:
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   APPLE_ID                   the Apple account email of your developer account
#   APPLE_APP_PASSWORD         an app-specific password from appleid.apple.com
#   APPLE_TEAM_ID              your 10-character Team ID (developer.apple.com → Membership)
# Without them the release is ad-hoc signed and needs the xattr step in docs/INSTALL.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macOS 26: needed to compile the light/dark/clear/tinted app icon (see ci.yml).
    runs-on: macos-26
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode (26+ compiles the dark and tinted icon)
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Test
        run: swift test
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # Tolerate the line breaks and spaces a copy and paste can add.
          P12_CLEAN="$(printf '%s' "$P12" | tr -d ' \r\n\t')"
          if ! printf '%s' "$P12_CLEAN" | base64 --decode > "$RUNNER_TEMP/developer-id.p12" 2>/dev/null \
              || [ "$(od -An -tx1 -N1 "$RUNNER_TEMP/developer-id.p12" | tr -d " ")" != "30" ]; then
            # A .p12 is DER, so its base64 always starts with "MI". Say what arrived, not what it is.
            echo "::error::DEVELOPER_ID_P12 is not a base64-encoded .p12 (${#P12_CLEAN} characters, starts with \"MI\": $([ "${P12_CLEAN:0:2}" = MI ] && echo yes || echo no)). On your Mac run: base64 -i /path/to/cert.p12 | pbcopy, then paste the result as the secret."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          # A Developer ID certificate only counts as valid with Apple's intermediate authorities,
          # which the runner may not have. Add both generations; duplicates are harmless.
          for CA in DeveloperIDG2CA DeveloperIDCA; do
            if curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"; then
              security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" >/dev/null 2>&1 || true
            else
              echo "::warning::Could not download Apple's $CA intermediate certificate."
            fi
          done
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "Certificates in the .p12:"
            security find-certificate -a "$KEYCHAIN" | grep '"labl"' || echo "  (none)"
            echo "Signing identities (a certificate plus its private key), including invalid ones:"
            security find-identity -p codesigning "$KEYCHAIN"
            if security find-certificate -c "Developer ID Application" "$KEYCHAIN" >/dev/null 2>&1; then
              echo "::error::The .p12 has the Developer ID Application certificate but not its private key, or macOS does not trust it (see the list above). Export it from Keychain Access → My Certificates, where it has a disclosure arrow, choosing both the certificate and its key."
            else
              echo "::error::The .p12 has no \"Developer ID Application\" certificate. Export that one (not Apple Development or Mac App Distribution) from Keychain Access → My Certificates."
            fi
            exit 1
          fi
          echo "Signing as $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Cache whisper.cpp
        uses: actions/cache@v6
        with:
          path: |
            build/whisper/bin
            build/whisper/VERSION
          key: whisper-cpp-${{ hashFiles('scripts/build-whisper.sh') }}
      - name: Build whisper.cpp with Core ML (shipped inside the app)
        run: scripts/build-whisper.sh
      - name: Build the app
        run: MURMUR_REQUIRE_WHISPER=1 MURMUR_VERSION="$GITHUB_REF_NAME" MURMUR_BUILD="$GITHUB_RUN_NUMBER" scripts/build-app.sh
      - name: Notarize the app
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/notarize.sh build/Murmur.app
      - name: Check the bundle
        run: |
          codesign --verify --strict --verbose build/Murmur.app
          test -s build/Murmur.app/Contents/Resources/Assets.car
          lipo -archs build/Murmur.app/Contents/MacOS/Murmur | grep -qx arm64
          plutil -extract CFBundleShortVersionString raw build/Murmur.app/Contents/Info.plist | grep -qx "${GITHUB_REF_NAME#v}"
          if [ "$SIGNED" = true ]; then
            codesign -d --entitlements - build/Murmur.app 2>&1 | grep -q com.apple.security.device.audio-input
            codesign -dv build/Murmur.app 2>&1 | grep -q 'flags=.*runtime'
            xcrun stapler validate build/Murmur.app
            spctl --assess --type execute --verbose=2 build/Murmur.app
          fi
      - name: Zip
        # For the in-app updater, which installs from the zip.
        run: ditto -c -k --keepParent build/Murmur.app "Murmur-$GITHUB_REF_NAME.zip"
      - name: Make the disk image
        # For first installs: opens as a window with the app and an Applications folder to drag it to.
        run: |
          brew install create-dmg || echo "::warning::create-dmg did not install; the disk image will have no background."
          scripts/make-dmg.sh "Murmur-$GITHUB_REF_NAME.dmg"
      - name: Notarize the disk image
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/notarize.sh "Murmur-$GITHUB_REF_NAME.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "Murmur-$GITHUB_REF_NAME.dmg"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Murmur-$GITHUB_REF_NAME.dmg" "Murmur-$GITHUB_REF_NAME.zip" \
            --title "Murmur $GITHUB_REF_NAME" --notes-file docs/INSTALL.md --verify-tag
      - name: Remove the signing keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
