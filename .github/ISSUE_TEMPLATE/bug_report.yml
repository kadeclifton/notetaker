name: Something isn't working
description: A bug, a crash, or text that didn't appear
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        In Murmur: Settings… → About → Copy Diagnostics, then paste here. It contains settings and
        status only, never anything you dictated or your API keys.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: private
    attributes:
      label: Before posting
      options:
        - label: I removed anything private from the text above (names, dictated text).
          required: true
